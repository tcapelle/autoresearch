apiVersion: batch/v1
kind: Job
metadata:
  name: autoresearch-train
  labels:
    app: autoresearch
    mode: train
spec:
  ttlSecondsAfterFinished: 604800
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  completionMode: Indexed
  completions: 2
  parallelism: 2
  template:
    metadata:
      labels:
        app: autoresearch
        mode: train
    spec:
      restartPolicy: Never
      nodeSelector:
        gpu.nvidia.com/class: rtxp6000-8x
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: clone-repo
          image: alpine/git:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -eu
              rm -rf /workspace/repo
              git clone --depth 1 --single-branch --branch codex/pai-git-jobs \
                https://github.com/tcapelle/autoresearch.git /workspace/repo
              git -C /workspace/repo rev-parse HEAD > /workspace/git-sha.txt
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: train
          image: pytorch/pytorch:2.9.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/repo
          command: ["/bin/bash", "scripts/pai_train.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GIT_REPO
              value: https://github.com/tcapelle/autoresearch.git
            - name: GIT_BRANCH
              value: codex/pai-git-jobs
            - name: AUTORESEARCH_CACHE_DIR
              value: /mnt/autoresearch/cache
            - name: UV_CACHE_DIR
              value: /mnt/autoresearch/uv-cache
            - name: RUNS_DIR
              value: /mnt/autoresearch/jobs
            - name: GPU_COUNT
              value: "1"
            - name: CPU_REQUEST
              value: "15995m"
            - name: MEMORY_REQUEST
              value: "125Gi"
            - name: WANDB_PROJECT
              value: autoresearch
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autoresearch-wandb
                  key: WANDB_API_KEY
                  optional: true
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "15995m"
              memory: "125Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "15995m"
              memory: "125Gi"
          volumeMounts:
            - name: shared
              mountPath: /mnt/autoresearch
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: autoresearch-shared
        - name: workspace
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
