apiVersion: batch/v1
kind: Job
metadata:
  name: autoresearch-prepare
  labels:
    app: autoresearch
    mode: prepare
spec:
  ttlSecondsAfterFinished: 604800
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: autoresearch
        mode: prepare
    spec:
      restartPolicy: Never
      initContainers:
        - name: clone-repo
          image: alpine/git:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -eu
              rm -rf /workspace/repo
              git clone --depth 1 --single-branch --branch codex/pai-git-jobs \
                https://github.com/tcapelle/autoresearch.git /workspace/repo
              git -C /workspace/repo rev-parse HEAD > /workspace/git-sha.txt
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: prepare
          image: pytorch/pytorch:2.9.1-cuda12.8-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/repo
          command: ["/bin/bash", "scripts/pai_prepare.sh"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GIT_REPO
              value: https://github.com/tcapelle/autoresearch.git
            - name: GIT_BRANCH
              value: codex/pai-git-jobs
            - name: AUTORESEARCH_CACHE_DIR
              value: /mnt/autoresearch/cache
            - name: UV_CACHE_DIR
              value: /mnt/autoresearch/uv-cache
            - name: RUNS_DIR
              value: /mnt/autoresearch/jobs
            - name: NUM_SHARDS
              value: "10"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4000m"
              memory: "32Gi"
            limits:
              cpu: "4000m"
              memory: "32Gi"
          volumeMounts:
            - name: shared
              mountPath: /mnt/autoresearch
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: autoresearch-shared
        - name: workspace
          emptyDir: {}
